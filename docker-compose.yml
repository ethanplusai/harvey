services:
  harvey:
    build: .
    env_file: .env
    ports:
      - "5555:5555"
    volumes:
      # Persist database across restarts
      - ./data:/app/data
      # Mount config for easy editing without rebuild
      - ./harvey.yaml:/app/harvey.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
      # Antigravity CLI (agy) binary and credentials
      - ~/.gemini:/home/harvey/.gemini
      - ~/.local/bin/agy:/usr/local/bin/agy:ro
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
